name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check . && ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: pip install . && payout-bridge examples/stripe/stripe-report.csv --provider stripe --ledger examples/stripe/ledger.csv --bank examples/stripe/bank.csv --ledger-tz America/New_York --fee "2.9%+0.30" --fail-on never > /dev/null
